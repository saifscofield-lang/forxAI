# ============================================================
# الإعدادات الأساسية للنظام — وضع جمع بيانات نظيفة للتدريب
# ============================================================

system:
  name: "ForexAI Trading Platform"
  version: "0.3.0"
  mode: "paper"              # paper | live

# --- الأدوات المالية (8 أزواج) ---
instruments:
  - symbol: "EURUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "GBPUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDJPY"
    digits: 3
    pip_value: 0.01
  - symbol: "XAUUSD"         # ذهب
    digits: 2
    pip_value: 0.01
  - symbol: "AUDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCAD"
    digits: 5
    pip_value: 0.0001
  - symbol: "NZDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCHF"
    digits: 5
    pip_value: 0.0001

# --- الإطار الزمني ---
timeframes:
  primary: "H1"              # ساعة — للإشارات (نظيف للتدريب)
  secondary: "H4"            # 4 ساعات — للاتجاه العام
  confirmation: "M15"        # 15 دقيقة — للدخول

# --- إدارة المخاطر (واقعية — بيانات نظيفة للتدريب) ---
risk:
  max_risk_per_trade: 0.01   # 1% per trade
  max_daily_drawdown: 0.05   # 5% daily max drawdown
  max_open_positions: 8      # صفقة واحدة لكل زوج
  max_correlated_positions: 3

# --- جلب البيانات ---
data:
  history_bars: 1000         # عدد الشموع التاريخية
  update_interval_seconds: 5

# --- التسجيل ---
logging:
  level: "INFO"
  file: "data/logs/system.log"
  rotation: "10 MB"
  retention: "30 days"
