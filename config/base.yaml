# ============================================================
# الإعدادات الأساسية للنظام — وضع جمع بيانات نظيفة للتدريب
# ============================================================

system:
  name: "ForexAI Trading Platform"
  version: "0.3.0"
  mode: "paper"              # paper | live

# --- الأدوات المالية (6 أزواج) ---
# USDCAD removed 2026-05-02 per AI-020 / decision_log.md 2026-05-01:
# 0 PASS verdicts across 40 backtest runs; v3 live -$544 net on 11 trades.
# NZDUSD removed earlier (IMP-48): 29% WR, -$3,336 loss across all strategies.
instruments:
  - symbol: "EURUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "GBPUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDJPY"
    digits: 3
    pip_value: 0.01
  - symbol: "XAUUSD"         # ذهب
    digits: 2
    pip_value: 0.01
  - symbol: "AUDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCHF"
    digits: 5
    pip_value: 0.0001

# --- الإطار الزمني ---
timeframes:
  primary: "H1"              # ساعة — للإشارات (نظيف للتدريب)
  secondary: "H4"            # 4 ساعات — للاتجاه العام
  confirmation: "M15"        # 15 دقيقة — للدخول

# --- إدارة المخاطر (واقعية — بيانات نظيفة للتدريب) ---
risk:
  max_risk_per_trade: 0.01   # 1% per trade
  max_daily_drawdown: 1.00   # disabled for demo — never stop trading
  max_daily_loss: 1.00       # disabled for demo — never stop trading
  max_open_positions: 10     # demo: allow many positions for data collection
  max_correlated_positions: 3  # IMP-30: max same-USD-direction positions
  max_total_risk: 0.03       # IMP-18: 3% max portfolio risk at any time
  min_sl_atr_multiplier: 1.5  # IMP-13: minimum SL distance in ATR units

# --- جلب البيانات ---
data:
  history_bars: 1000         # عدد الشموع التاريخية
  update_interval_seconds: 5

# Strategy blacklist — kept identical to paper.yaml after 2026-04-28 meeting (Vote 6 D).
# Both configs MUST stay synchronized until config-parity CI guard (AI-004) lands.
# Original v2 rationale ("Lost $30K+ shorting gold in uptrend"): superseded by
# forward-looking rationale in paper.yaml.
strategy_blacklist:
  - strategy: "ml_direct"
    symbol: "XAUUSD"
    reason: "Zero-BUY structural defect; meeting vote 6D 2026-04-28; lift requires AI-001 + June 1 gate"

  - strategy: "ml_filtered_sma"
    symbol: "XAUUSD"
    reason: "Mirrored from base.yaml; strategy retired entirely 2026-04-28 (vote 5)"

# --- فلتر الجلسات (من تقرير 119 صفقة) ---
session_filter:
  blocked_hours_utc: [8, 15, 23]     # ساعات خسارة ثابتة: -$5,500+
  golden_hours_utc: [7, 10, 11, 16, 17]  # أفضل ساعات الأداء
  thursday_risk: "reduced"            # أسوأ يوم في البيانات

# --- التسجيل ---
logging:
  level: "INFO"
  file: "data/logs/system.log"
  rotation: "10 MB"
  retention: "30 days"
