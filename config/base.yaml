# ============================================================
# الإعدادات الأساسية للنظام — وضع جمع البيانات العدواني
# ============================================================

system:
  name: "ForexAI Trading Platform"
  version: "0.2.0"
  mode: "paper"              # paper | live

# --- الأدوات المالية (8 أزواج لزيادة البيانات) ---
instruments:
  - symbol: "EURUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "GBPUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDJPY"
    digits: 3
    pip_value: 0.01
  - symbol: "XAUUSD"         # ذهب
    digits: 2
    pip_value: 0.01
  - symbol: "AUDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCAD"
    digits: 5
    pip_value: 0.0001
  - symbol: "NZDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCHF"
    digits: 5
    pip_value: 0.0001

# --- الإطار الزمني ---
timeframes:
  primary: "M15"             # 15 دقيقة — للإشارات (سريع لجمع البيانات)
  secondary: "H1"            # ساعة — للاتجاه العام
  confirmation: "M5"         # 5 دقائق — للدخول

# --- إدارة المخاطر (مخففة — حساب ديمو لجمع البيانات) ---
risk:
  max_risk_per_trade: 0.02   # 2% per trade
  max_daily_drawdown: 1.0    # 100% — disabled for demo
  max_open_positions: 50     # السماح بصفقات كثيرة
  max_correlated_positions: 10

# --- جلب البيانات ---
data:
  history_bars: 1000         # عدد الشموع التاريخية
  update_interval_seconds: 5

# --- التسجيل ---
logging:
  level: "INFO"
  file: "data/logs/system.log"
  rotation: "10 MB"
  retention: "30 days"
