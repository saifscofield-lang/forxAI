# ============================================================
# إعدادات التداول التجريبي (Paper Trading)
# مخاطر أعلى للاختبار وجمع البيانات
# ============================================================

system:
  name: "ForexAI Trading Platform"
  version: "0.3.0"
  mode: "paper"

# --- الأدوات المالية (7 أزواج) ---
instruments:
  - symbol: "EURUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "GBPUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDJPY"
    digits: 3
    pip_value: 0.01
  - symbol: "XAUUSD"
    digits: 2
    pip_value: 0.01
  - symbol: "AUDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCAD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCHF"
    digits: 5
    pip_value: 0.0001

# --- الإطار الزمني ---
timeframes:
  primary: "H1"
  secondary: "H4"
  confirmation: "M15"

# --- إدارة المخاطر (مرنة للاختبار) ---
risk:
  max_risk_per_trade: 0.01     # 1% per trade
  max_daily_drawdown: 1.00     # disabled for demo — never stop trading
  max_daily_loss: 1.00         # disabled for demo — never stop trading
  max_open_positions: 10       # demo: allow many positions for data collection
  max_correlated_positions: 3
  max_total_risk: 0.03         # 3% portfolio risk
  min_sl_atr_multiplier: 1.5

# ============================================================
# Strategy Blacklist (Installed 2026-04-28 per Meeting Vote 6, Option D)
# ============================================================
# Decision: block ml_direct on XAUUSD in BOTH configs until zero-BUY is
# resolved (AI-001). The +$21k v3 ml_direct/XAUUSD profit was made during
# a confirmed gold downtrend; the strategy has zero BUY capability across
# 105 trades in 3 versions. Continuing to run it into a projected reversal
# regime (Q3 2026 institutional consensus: bullish $5k-$6k) would convert
# accumulated profit into mirror-image loss with no defensive capability.
#
# Lift conditions (ALL required):
#   1. AI-001 (zero-BUY fix) shipped + validated on holdout
#   2. June 1 Phase 8 gate review GREEN
#   3. RFC documenting forward-looking justification (not P&L-justified)
#
# Per Vote 6 Option D: this entry mirrors base.yaml::strategy_blacklist.
# ============================================================
strategy_blacklist:
  - strategy: "ml_direct"
    symbol: "XAUUSD"
    reason: "Zero-BUY structural defect; meeting vote 6D 2026-04-28; lift requires AI-001 + June 1 gate"

  - strategy: "ml_filtered_sma"
    symbol: "XAUUSD"
    reason: "Mirrored from base.yaml; strategy retired entirely 2026-04-28 (vote 5)"

# --- فلتر الجلسات ---
session_filter:
  blocked_hours_utc: [8, 15, 23]
  golden_hours_utc: [7, 10, 11, 16, 17]
  thursday_risk: "reduced"

# --- جلب البيانات ---
data:
  history_bars: 1000
  update_interval_seconds: 5

# --- التسجيل ---
logging:
  level: "INFO"
  file: "data/logs/system.log"
  rotation: "10 MB"
  retention: "30 days"
