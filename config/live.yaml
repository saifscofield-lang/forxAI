# ============================================================
# إعدادات التداول الحقيقي (Live Trading)
# مخاطر محافظة — الحماية أولاً
# ============================================================

system:
  name: "ForexAI Trading Platform"
  version: "0.3.0"
  mode: "live"

# --- الأدوات المالية (6 أزواج) ---
# USDCAD removed 2026-05-06 (live.yaml catch-up sync). AI-020 dropped
# USDCAD from paper.yaml + base.yaml on 2026-05-02 but missed
# live.yaml — exactly the multi-file divergence class AI-004b's
# parity check is designed to detect.
instruments:
  - symbol: "EURUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "GBPUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDJPY"
    digits: 3
    pip_value: 0.01
  - symbol: "XAUUSD"
    digits: 2
    pip_value: 0.01
  - symbol: "AUDUSD"
    digits: 5
    pip_value: 0.0001
  - symbol: "USDCHF"
    digits: 5
    pip_value: 0.0001

# Strategy blacklist — must stay in sync with base.yaml + paper.yaml.
# AI-004b's parity check fires at engine startup AND every drift
# cycle if these diverge. Lift conditions for ml_direct/XAUUSD:
# AI-001 (zero-BUY fix) + Jun 1 gate review GREEN. See paper.yaml
# header comment for the full rationale.
strategy_blacklist:
  - strategy: "ml_direct"
    symbol: "XAUUSD"
    reason: "Zero-BUY structural defect; meeting vote 6D 2026-04-28; lift requires AI-001 + June 1 gate"

  - strategy: "ml_filtered_sma"
    symbol: "XAUUSD"
    reason: "Mirrored from base.yaml; strategy retired entirely 2026-04-28 (vote 5)"

# --- الإطار الزمني ---
timeframes:
  primary: "H1"
  secondary: "H4"
  confirmation: "M15"

# --- إدارة المخاطر (محافظة — حماية رأس المال) ---
risk:
  max_risk_per_trade: 0.005    # 0.5% per trade (نصف Paper)
  max_daily_drawdown: 0.05     # 5% drawdown limit — مفعّل!
  max_daily_loss: 0.02         # 2% daily loss limit — مفعّل!
  max_open_positions: 5        # أقل من Paper
  max_correlated_positions: 2  # أكثر تحفظاً
  max_total_risk: 0.02         # 2% portfolio risk (أقل من Paper)
  min_sl_atr_multiplier: 1.5

# --- جلب البيانات ---
data:
  history_bars: 1000
  update_interval_seconds: 5

# --- التسجيل ---
logging:
  level: "INFO"
  file: "data/logs/system.log"
  rotation: "10 MB"
  retention: "30 days"
